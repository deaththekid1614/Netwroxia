# ═══════════════════════════════════════════════════════════════
# Netwroxia Stage 2 — Telegraf Configuration
# Collects: interface stats, BGP state, OSPF neighbors, ping latency
# From: 4 FRR routers (HO-Chennai, ZO-Bengaluru, BR-Koramangala, BR-Whitefield)
# ═══════════════════════════════════════════════════════════════

[global_tags]
  project = "netwroxia"
  stage = "stage2"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 100
  metric_buffer_limit = 1000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "1s"
  hostname = "netwroxia-telegraf"
  omit_hostname = false

# ═══════════════════════════════════════════════════════════════
# OUTPUT: InfluxDB 1.8
# ═══════════════════════════════════════════════════════════════
[[outputs.influxdb]]
  urls = ["http://netwroxia-influxdb:8086"]
  database = "netwroxia"
  retention_policy = "one_week"
  username = "admin"
  password = "netwroxia123"
  timeout = "5s"

# ═══════════════════════════════════════════════════════════════
# INPUT 1: Ping to all router loopbacks (end-to-end path health)
# ═══════════════════════════════════════════════════════════════
[[inputs.ping]]
  urls = [
    "172.20.20.4",   # HO-Chennai
    "172.20.20.5",   # ZO-Bengaluru
    "172.20.20.2",   # BR-Koramangala
    "172.20.20.3"   # BR-Whitefield
  ]
  count = 3
  ping_interval = 1.0
  timeout = 5.0
  [inputs.ping.tags]
    metric_type = "path_health"

# ═══════════════════════════════════════════════════════════════
# INPUT 2: BGP Peer State (via vtysh exec)
# Runs inside each router container via docker exec
# ═══════════════════════════════════════════════════════════════
[[inputs.exec]]
  commands = [
    "bash -c 'docker exec clab-netwroxia-ho-chennai vtysh -c \"show ip bgp summary\" 2>/dev/null | grep -E \"^[0-9]+\\.[0-9]+\" | awk \"{print \\\"bgp_peer,router=ho-chennai,peer=\\\"\\$1\\\" state=\\\"\\$10\\\"\\\"}\" | sed \"s/Established/1/;s/Active/0/;s/Idle/0/;s/Connect/0/\"'",
    "bash -c 'docker exec clab-netwroxia-zo-bengaluru vtysh -c \"show ip bgp summary\" 2>/dev/null | grep -E \"^[0-9]+\\.[0-9]+\" | awk \"{print \\\"bgp_peer,router=zo-bengaluru,peer=\\\"\\$1\\\" state=\\\"\\$10\\\"\\\"}\" | sed \"s/Established/1/;s/Active/0/;s/Idle/0/;s/Connect/0/\"'",
    "bash -c 'docker exec clab-netwroxia-br-koramangala vtysh -c \"show ip bgp summary\" 2>/dev/null | grep -E \"^[0-9]+\\.[0-9]+\" | awk \"{print \\\"bgp_peer,router=br-koramangala,peer=\\\"\\$1\\\" state=\\\"\\$10\\\"\\\"}\" | sed \"s/Established/1/;s/Active/0/;s/Idle/0/;s/Connect/0/\"'",
    "bash -c 'docker exec clab-netwroxia-br-whitefield vtysh -c \"show ip bgp summary\" 2>/dev/null | grep -E \"^[0-9]+\\.[0-9]+\" | awk \"{print \\\"bgp_peer,router=br-whitefield,peer=\\\"\\$1\\\" state=\\\"\\$10\\\"\\\"}\" | sed \"s/Established/1/;s/Active/0/;s/Idle/0/;s/Connect/0/\"'"
  ]
  timeout = "15s"
  data_format = "influx"
  interval = "30s"
  [inputs.exec.tags]
    metric_type = "routing"

# ═══════════════════════════════════════════════════════════════
# INPUT 3: OSPF Neighbor Count (via vtysh exec)
# ═══════════════════════════════════════════════════════════════
[[inputs.exec]]
  commands = [
    "bash -c 'count=$(docker exec clab-netwroxia-ho-chennai vtysh -c \"show ip ospf neighbor\" 2>/dev/null | grep -c Full); echo \"ospf_neighbors,router=ho-chennai count=$count\"'",
    "bash -c 'count=$(docker exec clab-netwroxia-zo-bengaluru vtysh -c \"show ip ospf neighbor\" 2>/dev/null | grep -c Full); echo \"ospf_neighbors,router=zo-bengaluru count=$count\"'",
    "bash -c 'count=$(docker exec clab-netwroxia-br-koramangala vtysh -c \"show ip ospf neighbor\" 2>/dev/null | grep -c Full); echo \"ospf_neighbors,router=br-koramangala count=$count\"'",
    "bash -c 'count=$(docker exec clab-netwroxia-br-whitefield vtysh -c \"show ip ospf neighbor\" 2>/dev/null | grep -c Full); echo \"ospf_neighbors,router=br-whitefield count=$count\"'"
  ]
  timeout = "15s"
  data_format = "influx"
  interval = "30s"
  [inputs.exec.tags]
    metric_type = "routing"

# ═══════════════════════════════════════════════════════════════
# INPUT 4: Interface Stats via SNMP (if FRR supports it)
# Fallback: Docker stats for container resource usage
# ═══════════════════════════════════════════════════════════════
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  container_name_include = [
    "clab-netwroxia-ho-chennai",
    "clab-netwroxia-zo-bengaluru",
    "clab-netwroxia-br-koramangala",
    "clab-netwroxia-br-whitefield"
  ]
  gather_services = false
  source_tag = true
  container_name_exclude = []
  timeout = "5s"
  perdevice_include = ["cpu", "blkio", "network"]
  total_include = ["cpu", "blkio", "network"]
  [inputs.docker.tags]
    metric_type = "container_resource"

# ═══════════════════════════════════════════════════════════════
# INPUT 5: Telegraf self-monitoring (CPU, memory, disk)
# ═══════════════════════════════════════════════════════════════
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false
  [inputs.cpu.tags]
    metric_type = "host_resource"

[[inputs.mem]]
  [inputs.mem.tags]
    metric_type = "host_resource"

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]
  [inputs.disk.tags]
    metric_type = "host_resource"

[[inputs.diskio]]
  [inputs.diskio.tags]
    metric_type = "host_resource"

[[inputs.net]]
  [inputs.net.tags]
    metric_type = "host_resource"