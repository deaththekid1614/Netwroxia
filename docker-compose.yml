version: "3.8"

services:
  influxdb:
    image: influxdb:1.8
    container_name: netwroxia-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=netwroxia
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=netwroxia123
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    volumes:
      - ./telemetry/influxdb/init-scripts:/docker-entrypoint-initdb.d
      - influxdb-data:/var/lib/influxdb
    networks:
      - netwroxia-telemetry

  telegraf:
    image: telegraf:1.28
    container_name: netwroxia-telegraf
    user: root
    restart: unless-stopped
    depends_on:
      - influxdb
    volumes:
      - ./telemetry/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /usr/bin/docker:/usr/bin/docker:ro
    networks:
      - netwroxia-telemetry
      - clab
    extra_hosts:
      - "ho-chennai:172.20.20.3"
      - "zo-bengaluru:172.20.20.4"
      - "br-koramangala:172.20.20.5"
      - "br-whitefield:172.20.20.7"

volumes:
  influxdb-data:

networks:
  netwroxia-telemetry:
    driver: bridge
  clab:
    external: true